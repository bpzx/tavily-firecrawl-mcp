[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavily-firecrawl-mcp"
version = "0.1.0"
description = "MCP server for web fetching with Tavily (primary) and Firecrawl (fallback), plus Tavily search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "demo" }]
keywords = ["mcp", "tavily", "firecrawl", "tavily-firecrawl", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.28",
    "httpx>=0.27",
    "anyio>=4.5",
]

[project.scripts]
tavily-firecrawl-mcp = "tavily_firecrawl_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
