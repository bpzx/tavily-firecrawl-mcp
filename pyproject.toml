[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavily-firecrawl-mcp"
description = "MCP server for web fetching with Tavily (primary) and Firecrawl (fallback), plus Tavily search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bpzx" }]
keywords = ["mcp", "tavily", "firecrawl", "tavily-firecrawl", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer (breaking); pinned to 1.x until migrated.
    "mcp>=1.28,<2",
    "httpx>=0.27",
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://github.com/bpzx/tavily-firecrawl-mcp"
Repository = "https://github.com/bpzx/tavily-firecrawl-mcp"
Issues = "https://github.com/bpzx/tavily-firecrawl-mcp/issues"

[project.scripts]
tavily-firecrawl-mcp = "tavily_firecrawl_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tavily_firecrawl_mcp.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
